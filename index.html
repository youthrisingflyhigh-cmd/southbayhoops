<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Southbay Hoops — Hype Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14110D;
    --surface: #1E1A13;
    --surface-hi: #2A2419;
    --line: #3A331F;
    --gold: #C9A84C;
    --orange: #FF4500;
    --cream: #EDE6D6;
    --dim: #8C8570;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--cream); font-family:'Inter',sans-serif; min-height:100vh;}
  body{
    background-image:
      radial-gradient(circle at 15% 0%, rgba(201,168,76,0.08), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(255,69,0,0.06), transparent 45%);
    padding-bottom: 100px;
  }

  /* ---------- header ---------- */
  header{
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark{
    font-family:'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1.5px;
    color: var(--cream);
    line-height: 1;
  }
  .wordmark span{ color: var(--gold); }
  .subline{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  /* now playing bar */
  .now-playing{
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 14px;
    display:flex;
    align-items:center;
    gap: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.5px;
    color: var(--dim);
  }
  .dot{
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }
  .dot.live{
    background: var(--orange);
    box-shadow: 0 0 0 0 rgba(255,69,0,0.6);
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(255,69,0,0.55); }
    70%{ box-shadow: 0 0 0 9px rgba(255,69,0,0); }
    100%{ box-shadow: 0 0 0 0 rgba(255,69,0,0); }
  }
  .now-playing .label{ color: var(--cream); font-weight: 600; }

  /* ---------- tabs ---------- */
  .tabs{
    display:flex;
    gap: 2px;
    margin: 18px 16px 0;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 3px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 10px 6px;
    font-family:'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--dim);
    border-radius: 8px;
    cursor:pointer;
    user-select:none;
    transition: all .15s ease;
  }
  .tab.active{
    background: var(--surface-hi);
    color: var(--gold);
  }

  /* ---------- pad grid ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }
  @media(min-width: 480px){ .grid{ grid-template-columns: repeat(3, 1fr); } }
  @media(min-width: 760px){ .grid{ grid-template-columns: repeat(4, 1fr); max-width: 900px; margin: 0 auto; } }

  .pad{
    position:relative;
    background: linear-gradient(180deg, var(--surface-hi), var(--surface));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 10px 16px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition: transform .06s ease, border-color .15s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 2px 0 rgba(0,0,0,0.4);
  }
  .pad:active{ transform: scale(0.96); }
  .pad .icon{ font-size: 26px; display:block; margin-bottom: 8px; }
  .pad .label{
    font-family:'Bebas Neue', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--cream);
    line-height: 1.15;
  }
  .pad .cat-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 6px;
    display:block;
  }
  .pad.playing{
    border-color: var(--orange);
    box-shadow: 0 0 0 2px rgba(255,69,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .pad.playing .icon{ animation: bump .5s ease infinite alternate; }
  @keyframes bump{ from{ transform: scale(1);} to{ transform: scale(1.12);} }

  /* ---------- bottom control bar ---------- */
  .controls{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(20,17,13,0.92);
    backdrop-filter: blur(6px);
    border-top: 1px solid var(--line);
    padding: 12px 16px;
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .stop-all{
    background: var(--orange);
    color: #1A0800;
    border:none;
    font-family:'Bebas Neue', sans-serif;
    font-size: 16px;
    letter-spacing: 1px;
    padding: 12px 18px;
    border-radius: 10px;
    cursor:pointer;
    flex-shrink:0;
  }
  .stop-all:active{ transform: scale(0.97); }
  .vol-wrap{ flex:1; display:flex; align-items:center; gap:8px; }
  .vol-wrap span{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--dim); }
  input[type="range"]{
    flex:1; accent-color: var(--gold); height: 4px;
  }

  .empty-note{
    grid-column: 1 / -1;
    text-align:center;
    color: var(--dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 30px 10px;
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">SOUTHBAY HOOPS <span>HYPE BOARD</span></div>
  <div class="subline">Courtside sound cues · Season 1</div>
  <div class="now-playing">
    <div class="dot" id="liveDot"></div>
    <span>NOW PLAYING:</span>
    <span class="label" id="nowPlayingLabel">—</span>
  </div>
</header>

<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>

<div class="controls">
  <button class="stop-all" id="stopAll">STOP</button>
  <div class="vol-wrap">
    <span>VOL</span>
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.9">
  </div>
</div>

<script>
/* ============================================================
   SOUND CONFIG
   Add/remove pads here. `file` should point to an mp3 in /sounds/.
   If the file is missing or fails to load, the pad falls back to
   a synthesized placeholder tone so you can test the board before
   real audio is in place.
   ============================================================ */
const soundConfig = [
  // Walkouts
  { id:'walk-1', category:'walkouts', label:'Starter Walkout', icon:'🚶', file:'sounds/walkout-1.mp3', tone:{freq:110, type:'sawtooth', dur:0.9} },
  { id:'walk-2', category:'walkouts', label:'MVP Entrance', icon:'⭐', file:'sounds/walkout-2.mp3', tone:{freq:98, type:'sawtooth', dur:1.1} },
  { id:'walk-3', category:'walkouts', label:'Team Intro Hit', icon:'📣', file:'sounds/walkout-3.mp3', tone:{freq:130, type:'square', dur:0.6} },
  { id:'walk-4', category:'walkouts', label:'Tunnel Stinger', icon:'🎺', file:'sounds/walkout-4.mp3', tone:{freq:150, type:'sawtooth', dur:0.8} },

  // Hype & Crowd
  { id:'hype-1', category:'hype', label:'Crowd Cheer', icon:'📢', file:'sounds/crowd-cheer.mp3', tone:{freq:600, type:'triangle', dur:0.7} },
  { id:'hype-2', category:'hype', label:'Big Crowd Roar', icon:'🔥', file:'sounds/crowd-roar.mp3', tone:{freq:220, type:'sawtooth', dur:1.2} },
  { id:'hype-3', category:'hype', label:'Air Horn', icon:'📯', file:'sounds/air-horn.mp3', tone:{freq:400, type:'square', dur:0.9} },
  { id:'hype-4', category:'hype', label:'Crowd Boo', icon:'👎', file:'sounds/crowd-boo.mp3', tone:{freq:90, type:'sawtooth', dur:1.0} },
  { id:'hype-5', category:'hype', label:'Drumroll', icon:'🥁', file:'sounds/drumroll.mp3', tone:{freq:180, type:'square', dur:1.0} },
  { id:'hype-6', category:'hype', label:'Applause', icon:'👏', file:'sounds/applause.mp3', tone:{freq:700, type:'triangle', dur:0.8} },

  // Build-Up
  { id:'build-1', category:'buildup', label:'Rising Tension', icon:'📈', file:'sounds/buildup-rise.mp3', tone:{freq:80, type:'sawtooth', dur:1.8} },
  { id:'build-2', category:'buildup', label:'Bass Drop Cue', icon:'💥', file:'sounds/bass-drop.mp3', tone:{freq:55, type:'square', dur:1.0} },
  { id:'build-3', category:'buildup', label:'Timeout Loop', icon:'⏱️', file:'sounds/timeout-loop.mp3', tone:{freq:250, type:'triangle', dur:1.4} },
  { id:'build-4', category:'buildup', label:'Clutch Moment', icon:'🎯', file:'sounds/clutch.mp3', tone:{freq:300, type:'sawtooth', dur:1.3} },
];

const categories = [
  { id:'walkouts', label:'WALKOUTS' },
  { id:'hype', label:'HYPE & CROWD' },
  { id:'buildup', label:'BUILD-UP' },
];

let activeCategory = 'walkouts';
let activePadId = null;
let currentAudio = null;
let audioCtx = null;

const tabsEl = document.getElementById('tabs');
const gridEl = document.getElementById('grid');
const nowPlayingLabel = document.getElementById('nowPlayingLabel');
const liveDot = document.getElementById('liveDot');
const volumeSlider = document.getElementById('volume');

function renderTabs(){
  tabsEl.innerHTML = '';
  categories.forEach(cat=>{
    const el = document.createElement('div');
    el.className = 'tab' + (cat.id === activeCategory ? ' active' : '');
    el.textContent = cat.label;
    el.onclick = () => { activeCategory = cat.id; renderTabs(); renderGrid(); };
    tabsEl.appendChild(el);
  });
}

function renderGrid(){
  gridEl.innerHTML = '';
  const pads = soundConfig.filter(s => s.category === activeCategory);
  if(pads.length === 0){
    gridEl.innerHTML = '<div class="empty-note">No pads in this category yet.</div>';
    return;
  }
  pads.forEach(sound=>{
    const pad = document.createElement('div');
    pad.className = 'pad' + (activePadId === sound.id ? ' playing' : '');
    pad.id = 'pad-' + sound.id;
    pad.innerHTML = `
      <span class="icon">${sound.icon}</span>
      <span class="label">${sound.label}</span>
      <span class="cat-tag">${sound.category}</span>
    `;
    pad.onclick = () => triggerSound(sound);
    gridEl.appendChild(pad);
  });
}

function stopCurrent(){
  if(currentAudio){
    if(currentAudio.pause) currentAudio.pause();
    currentAudio = null;
  }
  if(activePadId){
    const prevPad = document.getElementById('pad-' + activePadId);
    if(prevPad) prevPad.classList.remove('playing');
  }
  activePadId = null;
  liveDot.classList.remove('live');
  nowPlayingLabel.textContent = '—';
}

function playPlaceholderTone(sound){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = sound.tone.type;
  osc.frequency.value = sound.tone.freq;
  gain.gain.setValueAtTime(volumeSlider.value * 0.5, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + sound.tone.dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + sound.tone.dur);
  currentAudio = { pause: () => { try{ osc.stop(); }catch(e){} } };
  setTimeout(()=>{
    if(activePadId === sound.id) stopCurrent();
  }, sound.tone.dur * 1000);
}

function triggerSound(sound){
  // toggle off if same pad tapped again
  if(activePadId === sound.id){
    stopCurrent();
    return;
  }
  stopCurrent();

  const audio = new Audio(sound.file);
  audio.volume = parseFloat(volumeSlider.value);

  let usedFallback = false;
  audio.onerror = () => {
    if(usedFallback) return;
    usedFallback = true;
    playPlaceholderTone(sound);
  };
  audio.onended = () => {
    if(activePadId === sound.id) stopCurrent();
  };

  audio.play().catch(() => {
    if(!usedFallback){
      usedFallback = true;
      playPlaceholderTone(sound);
    }
  });

  currentAudio = audio;
  activePadId = sound.id;

  const pad = document.getElementById('pad-' + sound.id);
  if(pad) pad.classList.add('playing');
  liveDot.classList.add('live');
  nowPlayingLabel.textContent = sound.label;
}

document.getElementById('stopAll').onclick = stopCurrent;
volumeSlider.oninput = () => {
  if(currentAudio && currentAudio.volume !== undefined){
    currentAudio.volume = parseFloat(volumeSlider.value);
  }
};

renderTabs();
renderGrid();
</script>

</body>
</html>
